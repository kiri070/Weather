<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather</title>
        <link rel="stylesheet" href="style.css">
    </head>

<body id = "body">
    <h1 id="h1_Text">大阪 天気</h1>

    <nav id="menu">
        <ul>
            <li><a href="https://open-meteo.com/">情報元: open-meteo</a></li>
        </ul>
    </nav>

    <div id="showWeatherGP">

        <div id="todayWeatherGP">
            <span>[現在]</span>
            <span id="weather"></span>
            <span id="temperature"></span>
            <span id="humidity"></span>
            <span id="windSpeed"></span> 
        </div>

        <div id="tomorrowWeatherGP">
            <span id="nextday"></span>
            <span id="weather_next"></span>
            <span id="temperature_next"></span>
            <span id="humidity_next"></span>
            <span id="windSpeed_next"></span> 
        </div>

        <div id="afterTomorrowWeatherGP">
            <span id="afterTomorrowday"></span>
            <span id="weather_afterTomorrow"></span>
            <span id="temperature_afterTomorrow"></span>
            <span id="humidity_afterTomorrow"></span>
            <span id="windSpeed_afterTomorrow"></span> 
        </div>

    </div>

    <div id="userInputGP">
        <button id="UpdateButton">更新</button>
    </div>
    
    <div id="showTimeGP">
        <span>最終更新: </span>
        <span id="year"></span>
        <span id="month"></span>
        <span id="day"></span>
        <span id="hour"></span>
        <span id="minutes"></span>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
